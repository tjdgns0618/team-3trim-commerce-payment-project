name: CI/CD Pipeline
on:
  push:
    branches:
      - prod
    paths-ignore:
      - '*.md'

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: 3trim-app
  CONTAINER_NAME: payment-app
  APP_PORT: 8080

permissions:
  # 클라우드 인증용 신분증 발급 권한
  id-token: write
  # 도커 이미지를 만들기 위한 코드 읽기 권한
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # 깃허브 액션의 가상 서버(컴퓨터)에 내 소스코드 다운로드 시키기
      - name: Checkout code
        uses: actions/checkout@v4

      # 후에 도커 이미지 태그에 사용될 고유 ID를 만드는 단계
      - name: Set short SHA
        id: vars
        # 현재 커밋의 고유 ID를 가져와서 7자리로 자른다.
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # 다운로드한 소스코드를 어떤 자바에서 사용할 건지 세팅하는 단계
      - name: Setup Java 17
        # 깃허브 자바 설치 플러그인
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Cache Gradle packages
        # 깃허브 캐시 저장 플러그인 (이미 다운로드 해놓은 플러그인은 그대로 사용)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

        # JAR파일로 빌드
      - name: Build JAR
        run: ./gradlew bootJar

    # jar 빌드 성공 이후 / 이미지 빌드 후 ECR에 도커 이미지 PUSH
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REGISTRY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REGISTRY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy to EC2 via SSM
        run: |
          IMAGE_URI="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'if ! command -v docker &> /dev/null; then sudo dnf install -y docker && sudo systemctl start docker && sudo systemctl enable docker && sudo usermod -aG docker ec2-user && sudo chmod 666 /var/run/docker.sock; fi',
              'sudo chmod 666 /var/run/docker.sock',
              'aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com',
              'docker pull ${IMAGE_URI}:latest',
              'docker stop my-app || true',
              'docker rm my-app || true',
              'docker run -d --name my-app -p 8080:8080 --restart unless-stopped -e SPRING_PROFILES_ACTIVE=prod ${IMAGE_URI}:latest',
              'echo 배포 완료'
            ]" \
            --region "${{ vars.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # 완료 대기
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region "${{ vars.AWS_REGION }}" \
              --query "Status" \
              --output text)

            echo "시도 ${i}/20 - 상태: ${STATUS}"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ 배포 성공!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ 배포 실패: ${STATUS}"
              exit 1
            fi

            sleep 15
          done

          echo "❌ 배포 타임아웃"
          exit 1